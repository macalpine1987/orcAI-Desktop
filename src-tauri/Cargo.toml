[package]
name = "orcai-desktop"
version = "1.0.2"
description = "orcAI Desktop"
authors = ["orcAI Desktop"]
edition = "2021"

[lib]
name = "orcai_desktop_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "orcai-desktop"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-os = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-store = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true

# bit-vec 0.8.0 ships .vscode/; some environments block unpacking it from crates.io.
[patch.crates-io]
bit-vec = { path = "../vendor/bit-vec" }
