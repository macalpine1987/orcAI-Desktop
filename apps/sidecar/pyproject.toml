[project]
name = "orcai-desktop-sidecar"
version = "0.1.7"
description = "Local API for orcAI Desktop"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "pydantic>=2.0",
  "pillow>=10.0",
  "soundfile>=0.12.0",
  "orcai @ git+https://github.com/ethz-tb/orcAI.git@v3.0.4",
]

[project.optional-dependencies]
analytics = ["duckdb>=1.0"]
dev = ["ruff>=0.6"]

[project.scripts]
orcai-desktop-sidecar = "orcai_desktop_sidecar.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/orcai_desktop_sidecar"]

# ЭК-1 / П-19: Clean Code + PEP 8 (NFR-19)
[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E",      # pycodestyle errors
  "W",      # pycodestyle warnings
  "F",      # pyflakes
  "I",      # isort
  "UP",     # pyupgrade
  "B",      # bugbear
  "SIM",    # simplify
  "RUF",    # ruff-specific
  "TRY",    # tryceratops (explicit errors)
  "BLE",    # blind except
  "S110",   # try-except-pass
  "PLR0402",
]
ignore = [
  "E501",   # existing long lines / f-strings
  "E402",   # intentional deferred imports (TF / path bootstrap)
  "TRY003", # long exception messages OK for user-facing sidecar errors
  "TRY300",
  "TRY301",
  "B008",   # FastAPI Depends() in defaults
  "SIM105", # contextlib.suppress is optional style
  "UP042",  # JobStatus(str, Enum) required for JSON serialization
  "RUF001", # en-dash in user-facing strings OK
  "RUF002", # unicode in docstrings OK
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "BLE001", "S110"]

[tool.ruff.lint.isort]
known-first-party = ["orcai_desktop_sidecar"]
